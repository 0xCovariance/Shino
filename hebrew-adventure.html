<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lost Letters of Jerusalem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;700&family=Poppins:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #0a0a1a;
    color: #e0d8c8;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 70%);
    z-index: 0;
  }
  .stars::after {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.7) 0%, transparent 100%);
  }

  #app {
    position: relative; z-index: 1;
    max-width: 800px; margin: 0 auto; padding: 20px;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .hebrew { font-family: 'Noto Sans Hebrew', serif; direction: rtl; }

  /* Title Screen */
  #title-screen { text-align: center; animation: fadeIn 1s ease; }
  #title-screen h1 {
    font-size: 2.8em; margin-bottom: 10px;
    background: linear-gradient(135deg, #f0c27f, #fc5c7d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #title-screen .subtitle { font-size: 1.1em; color: #a099b0; margin-bottom: 40px; }

  .btn {
    display: inline-block; padding: 14px 36px; border: none; border-radius: 12px;
    font-family: 'Poppins', sans-serif; font-size: 1.1em; font-weight: 600;
    cursor: pointer; transition: all 0.3s ease; color: white;
    background: linear-gradient(135deg, #667eea, #764ba2);
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(102, 126, 234, 0.5); }
  .btn:active { transform: translateY(0); }
  .btn-small { padding: 10px 24px; font-size: 0.95em; }
  .btn-gold {
    background: linear-gradient(135deg, #f0c27f, #e8a435);
    box-shadow: 0 4px 20px rgba(240, 194, 127, 0.3);
  }
  .btn-gold:hover { box-shadow: 0 6px 25px rgba(240, 194, 127, 0.5); }
  .btn-green {
    background: linear-gradient(135deg, #56ab2f, #a8e063);
    box-shadow: 0 4px 20px rgba(86, 171, 47, 0.3);
  }

  /* Game area */
  .game-container {
    width: 100%; animation: fadeIn 0.5s ease;
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; margin-bottom: 20px;
    background: rgba(255,255,255,0.05); border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  .top-bar .chapter { font-weight: 600; color: #f0c27f; }
  .top-bar .xp { color: #a8e063; font-weight: 600; }
  .top-bar .hearts { color: #fc5c7d; font-size: 1.2em; }

  .story-box {
    background: rgba(255,255,255,0.05); border-radius: 16px;
    padding: 30px; margin-bottom: 24px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
  }
  .story-box .scene-icon { font-size: 2.5em; margin-bottom: 16px; display: block; }
  .story-box p { margin-bottom: 12px; }
  .story-box .narrator { color: #a099b0; font-style: italic; }
  .story-box .npc-name { color: #f0c27f; font-weight: 700; }
  .story-box .hebrew-highlight {
    font-family: 'Noto Sans Hebrew', serif; font-size: 1.3em;
    color: #88d8ff; display: inline; direction: rtl;
  }
  .story-box .teach-block {
    background: rgba(102, 126, 234, 0.15); border-left: 3px solid #667eea;
    padding: 16px 20px; border-radius: 0 10px 10px 0; margin: 16px 0;
  }
  .story-box .teach-block .big-hebrew {
    font-family: 'Noto Sans Hebrew', serif; font-size: 2.4em;
    color: #88d8ff; direction: rtl; display: block; margin: 8px 0;
  }
  .story-box .teach-block .phonetic { color: #c9a0dc; font-style: italic; }
  .story-box .teach-block .meaning { color: #a8e063; }

  /* Challenge area */
  .challenge-box {
    background: rgba(252, 92, 125, 0.08); border-radius: 16px;
    padding: 30px; margin-bottom: 24px;
    border: 1px solid rgba(252, 92, 125, 0.15);
  }
  .challenge-box h3 { color: #fc5c7d; margin-bottom: 16px; font-size: 1.1em; }
  .challenge-box .question { font-size: 1.15em; margin-bottom: 20px; }
  .challenge-box .question .hebrew-big {
    font-family: 'Noto Sans Hebrew', serif; font-size: 2em;
    color: #88d8ff; direction: rtl;
  }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option-btn {
    padding: 14px 20px; border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px; background: rgba(255,255,255,0.04);
    color: #e0d8c8; font-family: 'Poppins', sans-serif; font-size: 1em;
    cursor: pointer; transition: all 0.3s ease; text-align: center;
  }
  .option-btn:hover { border-color: #667eea; background: rgba(102,126,234,0.1); }
  .option-btn.correct {
    border-color: #56ab2f; background: rgba(86,171,47,0.2);
    animation: pulse-green 0.5s ease;
  }
  .option-btn.wrong {
    border-color: #fc5c7d; background: rgba(252,92,125,0.2);
    animation: shake 0.4s ease;
  }
  .option-btn .option-hebrew {
    font-family: 'Noto Sans Hebrew', serif; direction: rtl; font-size: 1.2em;
  }

  .feedback-msg {
    text-align: center; padding: 16px; border-radius: 12px; margin-top: 16px;
    font-weight: 600; animation: fadeIn 0.3s ease;
  }
  .feedback-msg.correct { background: rgba(86,171,47,0.15); color: #a8e063; }
  .feedback-msg.wrong { background: rgba(252,92,125,0.15); color: #fc5c7d; }

  .continue-area { text-align: center; margin-top: 20px; }

  /* Progress bar */
  .progress-bar-container {
    width: 100%; height: 6px; background: rgba(255,255,255,0.1);
    border-radius: 3px; margin-bottom: 20px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 3px; transition: width 0.5s ease;
  }

  /* Word journal */
  .journal-toggle {
    position: fixed; bottom: 20px; right: 20px; z-index: 10;
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #f0c27f, #e8a435);
    border: none; font-size: 1.4em; cursor: pointer;
    box-shadow: 0 4px 15px rgba(240,194,127,0.4);
    transition: transform 0.3s ease;
  }
  .journal-toggle:hover { transform: scale(1.1); }

  .journal-panel {
    position: fixed; top: 0; right: -380px; width: 360px; height: 100%;
    background: #14142e; border-left: 1px solid rgba(255,255,255,0.1);
    z-index: 20; transition: right 0.3s ease; overflow-y: auto; padding: 24px;
  }
  .journal-panel.open { right: 0; }
  .journal-panel h2 { color: #f0c27f; margin-bottom: 20px; }
  .journal-close {
    position: absolute; top: 16px; right: 16px; background: none;
    border: none; color: #a099b0; font-size: 1.4em; cursor: pointer;
  }
  .journal-entry {
    padding: 12px; margin-bottom: 10px;
    background: rgba(255,255,255,0.04); border-radius: 10px;
    border-left: 3px solid #667eea;
  }
  .journal-entry .j-hebrew {
    font-family: 'Noto Sans Hebrew', serif; font-size: 1.5em;
    color: #88d8ff; direction: rtl;
  }
  .journal-entry .j-phonetic { color: #c9a0dc; font-size: 0.9em; }
  .journal-entry .j-meaning { color: #a8e063; }
  .journal-entry .j-chapter { color: #a099b0; font-size: 0.8em; }
  .journal-empty { color: #a099b0; font-style: italic; }

  /* Chapter complete */
  .chapter-complete {
    text-align: center; animation: fadeIn 0.5s ease;
  }
  .chapter-complete .trophy { font-size: 4em; margin-bottom: 20px; }
  .chapter-complete h2 {
    font-size: 2em; margin-bottom: 10px;
    background: linear-gradient(135deg, #f0c27f, #fc5c7d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .chapter-complete .stats { color: #a099b0; margin-bottom: 10px; }
  .chapter-complete .words-learned {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    margin: 24px 0;
  }
  .chapter-complete .word-badge {
    background: rgba(102,126,234,0.15); border: 1px solid rgba(102,126,234,0.3);
    border-radius: 10px; padding: 10px 16px; text-align: center;
  }
  .word-badge .wb-hebrew {
    font-family: 'Noto Sans Hebrew', serif; font-size: 1.4em;
    color: #88d8ff; direction: rtl; display: block;
  }
  .word-badge .wb-english { color: #a8e063; font-size: 0.85em; }

  /* Game over */
  .game-over { text-align: center; }
  .game-over h2 { font-size: 2.5em; margin: 20px 0; color: #fc5c7d; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse-green { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .hidden { display: none !important; }

  /* Map screen */
  .map-screen { text-align: center; animation: fadeIn 0.5s ease; }
  .map-screen h2 { color: #f0c27f; font-size: 1.8em; margin-bottom: 24px; }
  .map-locations { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .map-loc {
    width: 100%; max-width: 500px; padding: 20px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
    display: flex; align-items: center; gap: 16px; cursor: pointer;
    transition: all 0.3s ease; text-align: left;
  }
  .map-loc:hover { border-color: #667eea; background: rgba(102,126,234,0.08); }
  .map-loc.locked { opacity: 0.4; cursor: not-allowed; }
  .map-loc.locked:hover { border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); }
  .map-loc.completed { border-color: rgba(86,171,47,0.4); }
  .map-loc .loc-icon { font-size: 2.2em; }
  .map-loc .loc-info h3 { font-size: 1.1em; color: #e0d8c8; }
  .map-loc .loc-info p { font-size: 0.9em; color: #a099b0; }
  .map-loc .loc-status { margin-left: auto; font-size: 1.3em; }
</style>
</head>
<body>
<div class="stars"></div>
<div id="app"></div>

<button class="journal-toggle" onclick="toggleJournal()" title="Word Journal">📖</button>
<div class="journal-panel" id="journal-panel">
  <button class="journal-close" onclick="toggleJournal()">✕</button>
  <h2>📖 Word Journal</h2>
  <div id="journal-entries"></div>
</div>

<script>
// ─── Game State ───
const state = {
  screen: 'title',
  chapter: 0,
  step: 0,
  xp: 0,
  hearts: 3,
  maxHearts: 3,
  journal: [],
  chaptersCompleted: [],
  challengeAnswered: false,
};

// ─── Story Content ───
const chapters = [
  {
    id: 'market',
    title: 'Chapter 1: The Old City Market',
    icon: '🏛️',
    location: 'The Shuk (Market)',
    description: 'Learn greetings and the first Hebrew letters',
    steps: [
      {
        type: 'story',
        icon: '🌅',
        text: `<p class="narrator">You arrive at the ancient gates of Jerusalem as the morning sun casts golden light across the stone walls. The sounds of a bustling market echo from within...</p>
        <p>You step through the gate and find yourself in the <strong>Shuk</strong> — the old market. Stalls overflow with spices, fruits, and colorful fabrics. An old shopkeeper waves you over with a warm smile.</p>`
      },
      {
        type: 'story',
        icon: '👴',
        text: `<p><span class="npc-name">Old Shopkeeper:</span> "Ah, a traveler! Welcome, welcome!"</p>
        <p>He places his hand on his chest and says warmly:</p>
        <div class="teach-block">
          <span class="big-hebrew">שָׁלוֹם</span>
          <span class="phonetic">"Shalom"</span> — <span class="meaning">Hello / Peace / Goodbye</span>
          <p style="margin-top:8px; color:#a099b0; font-size:0.9em;">The most important word in Hebrew — it means hello, goodbye, AND peace. You'll hear it everywhere!</p>
        </div>
        <p><span class="npc-name">Shopkeeper:</span> "In our language, we greet with peace itself. Can you say it back to me?"</p>`,
        teaches: { hebrew: 'שָׁלוֹם', phonetic: 'Shalom', meaning: 'Hello / Peace / Goodbye' }
      },
      {
        type: 'challenge',
        question: 'The shopkeeper greeted you warmly. How do you greet him back?',
        options: [
          { text: 'שָׁלוֹם (Shalom)', correct: true },
          { text: 'בוקר (Boker)', correct: false },
          { text: 'מַיִם (Mayim)', correct: false },
          { text: 'לַיְלָה (Layla)', correct: false },
        ],
        correctMsg: '"שָׁלוֹם!" The shopkeeper beams. "You\'re a natural! Peace be with you, friend."',
        wrongMsg: 'The shopkeeper chuckles. "Not quite! Remember — שָׁלוֹם (Shalom) means hello, peace, and goodbye!"',
      },
      {
        type: 'story',
        icon: '✨',
        text: `<p>The shopkeeper nods approvingly and gestures around his stall full of fresh fruits and warm bread.</p>
        <p><span class="npc-name">Shopkeeper:</span> "Now, if someone does something nice for you, or gives you something, you say..."</p>
        <div class="teach-block">
          <span class="big-hebrew">תּוֹדָה</span>
          <span class="phonetic">"Todah"</span> — <span class="meaning">Thank you</span>
          <p style="margin-top:8px; color:#a099b0; font-size:0.9em;">One of the first words every visitor learns. To say "thank you very much," say <strong>תּוֹדָה רַבָּה</strong> (Todah Rabah)!</p>
        </div>`,
        teaches: { hebrew: 'תּוֹדָה', phonetic: 'Todah', meaning: 'Thank you' }
      },
      {
        type: 'story',
        icon: '🍎',
        text: `<p>The shopkeeper hands you a beautiful red apple from his stall.</p>
        <p><span class="npc-name">Shopkeeper:</span> "A gift for the traveler! This is called..."</p>
        <div class="teach-block">
          <span class="big-hebrew">תַּפּוּחַ</span>
          <span class="phonetic">"Tapuach"</span> — <span class="meaning">Apple</span>
        </div>
        <p>He smiles. "Now... what do you say when someone gives you a gift?"</p>`,
        teaches: { hebrew: 'תַּפּוּחַ', phonetic: 'Tapuach', meaning: 'Apple' }
      },
      {
        type: 'challenge',
        question: 'The shopkeeper just gave you a gift! What do you say?',
        options: [
          { text: 'תּוֹדָה (Todah)', correct: true },
          { text: 'שָׁלוֹם (Shalom)', correct: false },
          { text: 'לֹא (Lo)', correct: false },
          { text: 'מַה (Mah)', correct: false },
        ],
        correctMsg: '"תּוֹדָה!" The shopkeeper laughs joyfully. "You have a good heart, traveler!"',
        wrongMsg: 'The shopkeeper gently reminds you: "When someone gives you something, say תּוֹדָה (Todah) — thank you!"',
      },
      {
        type: 'story',
        icon: '🔤',
        text: `<p><span class="npc-name">Shopkeeper:</span> "Before you go deeper into the city, let me teach you the very first letter of our alphabet — the <strong>Alef-Bet</strong>."</p>
        <div class="teach-block">
          <span class="big-hebrew">א</span>
          <span class="phonetic">"Alef"</span> — <span class="meaning">The 1st letter (silent — takes the sound of its vowel)</span>
          <p style="margin-top:8px; color:#a099b0; font-size:0.9em;">Alef is special — it's silent on its own. It's like a blank canvas that takes whatever vowel sound is paired with it.</p>
        </div>
        <div class="teach-block">
          <span class="big-hebrew">ב</span>
          <span class="phonetic">"Bet"</span> — <span class="meaning">The 2nd letter (sounds like "B")</span>
          <p style="margin-top:8px; color:#a099b0; font-size:0.9em;">Bet makes a "B" sound. The word "Alef-Bet" (alphabet!) comes from these first two letters — just like Alpha-Beta in Greek!</p>
        </div>`,
        teaches: { hebrew: 'א ב', phonetic: 'Alef, Bet', meaning: 'First two Hebrew letters' }
      },
      {
        type: 'challenge',
        question: 'Which letter is the FIRST letter of the Hebrew alphabet?',
        questionHebrew: 'א  or  ב ?',
        options: [
          { text: 'א (Alef)', correct: true },
          { text: 'ב (Bet)', correct: false },
          { text: 'ג (Gimel)', correct: false },
          { text: 'ד (Dalet)', correct: false },
        ],
        correctMsg: 'That\'s right! א (Alef) is the first letter. The Hebrew "alphabet" is called the Alef-Bet!',
        wrongMsg: 'Not quite! א (Alef) is the first letter, and ב (Bet) is the second — together they give us "Alef-Bet!"',
      },
    ]
  },
  {
    id: 'kotel',
    title: 'Chapter 2: The Western Wall',
    icon: '🧱',
    location: 'The Kotel (Western Wall)',
    description: 'Learn numbers, yes/no, and more letters',
    steps: [
      {
        type: 'story',
        icon: '🧱',
        text: `<p class="narrator">Following the shopkeeper's directions, you walk through narrow stone alleyways. The ancient walls seem to whisper with centuries of stories. Finally, the path opens up to reveal a vast plaza...</p>
        <p>Before you stands the <strong>Kotel</strong> — the Western Wall. People from around the world stand here, some praying, some simply touching the ancient stones in silence. A young guide approaches you.</p>`
      },
      {
        type: 'story',
        icon: '🧑‍🏫',
        text: `<p><span class="npc-name">Guide (Yael):</span> "שָׁלוֹם! I'm Yael. Would you like to learn a bit as we walk? First — the essentials: yes and no!"</p>
        <div class="teach-block">
          <span class="big-hebrew">כֵּן</span>
          <span class="phonetic">"Ken"</span> — <span class="meaning">Yes</span>
        </div>
        <div class="teach-block">
          <span class="big-hebrew">לֹא</span>
          <span class="phonetic">"Lo"</span> — <span class="meaning">No</span>
        </div>
        <p><span class="npc-name">Yael:</span> "Simple, right? כֵּן or לֹא — yes or no!"</p>`,
        teaches: { hebrew: 'כֵּן / לֹא', phonetic: 'Ken / Lo', meaning: 'Yes / No' }
      },
      {
        type: 'challenge',
        question: 'Yael asks: "Do you want to learn Hebrew?" How do you say YES?',
        options: [
          { text: 'כֵּן (Ken)', correct: true },
          { text: 'לֹא (Lo)', correct: false },
          { text: 'תּוֹדָה (Todah)', correct: false },
          { text: 'שָׁלוֹם (Shalom)', correct: false },
        ],
        correctMsg: '"כֵּן!" Yael grins. "That\'s the spirit! Let\'s keep going!"',
        wrongMsg: 'Yael laughs: "כֵּן (Ken) means yes! I hope you want to keep learning!"',
      },
      {
        type: 'story',
        icon: '🔢',
        text: `<p><span class="npc-name">Yael:</span> "Let me teach you to count to three in Hebrew. Ready?"</p>
        <div class="teach-block">
          <span class="big-hebrew">אֶחָד</span>
          <span class="phonetic">"Echad"</span> — <span class="meaning">One (1)</span>
        </div>
        <div class="teach-block">
          <span class="big-hebrew">שְׁנַיִם</span>
          <span class="phonetic">"Shnayim"</span> — <span class="meaning">Two (2)</span>
        </div>
        <div class="teach-block">
          <span class="big-hebrew">שָׁלוֹשׁ</span>
          <span class="phonetic">"Shalosh"</span> — <span class="meaning">Three (3)</span>
        </div>
        <p><span class="npc-name">Yael:</span> "אֶחָד, שְׁנַיִם, שָׁלוֹשׁ — one, two, three! Notice how שָׁלוֹשׁ (three) sounds a bit like שָׁלוֹם (peace)? Hebrew words from the same root often sound similar!"</p>`,
        teaches: { hebrew: 'אֶחָד שְׁנַיִם שָׁלוֹשׁ', phonetic: 'Echad, Shnayim, Shalosh', meaning: '1, 2, 3' }
      },
      {
        type: 'challenge',
        question: 'How do you say the number TWO in Hebrew?',
        options: [
          { text: 'שְׁנַיִם (Shnayim)', correct: true },
          { text: 'אֶחָד (Echad)', correct: false },
          { text: 'שָׁלוֹשׁ (Shalosh)', correct: false },
          { text: 'שָׁלוֹם (Shalom)', correct: false },
        ],
        correctMsg: 'Exactly! שְׁנַיִם (Shnayim) = Two. You\'re counting like a pro!',
        wrongMsg: 'Not quite! אֶחָד = one, שְׁנַיִם = two, שָׁלוֹשׁ = three. Remember: Shnayim = 2!',
      },
      {
        type: 'story',
        icon: '🔤',
        text: `<p><span class="npc-name">Yael:</span> "Two more letters for you! These are very common."</p>
        <div class="teach-block">

// ─── Render Engine ───
function render() {
  const app = document.getElementById('app');

  if (state.screen === 'title') {
    app.innerHTML = `
      <div id="title-screen">
        <div style="font-size:4em; margin-bottom:20px;">🏛️✨</div>
        <h1>The Lost Letters<br>of Jerusalem</h1>
        <p class="subtitle">A Hebrew Learning Adventure</p>
        <p style="color:#a099b0; max-width:450px; margin:0 auto 30px; line-height:1.7;">
          Journey through the ancient city, meet colorful characters, and learn Hebrew words, phrases, and letters along the way.
        </p>
        <button class="btn" onclick="startGame()">Begin Your Journey</button>
        <p style="color:#665f70; margin-top:20px; font-size:0.85em;">📖 Tap the book icon anytime to review words you've learned</p>
      </div>`;
    return;
  }

  if (state.screen === 'map') {
    renderMap(app);
    return;
  }

  if (state.screen === 'chapter-complete') {
    renderChapterComplete(app);
    return;
  }

  if (state.screen === 'game-over') {
    app.innerHTML = `
      <div class="game-over">
        <div style="font-size:4em;">💔</div>
        <h2>Journey Paused</h2>
        <p style="color:#a099b0; margin-bottom:10px;">You've run out of hearts, but don't worry — every great learner stumbles!</p>
        <p style="color:#a099b0; margin-bottom:30px;">You learned <strong style="color:#a8e063;">${state.journal.length} words</strong> on your journey.</p>
        <button class="btn" onclick="restartGame()">Try Again</button>
      </div>`;
    return;
  }

  if (state.screen === 'victory') {
    app.innerHTML = `
      <div class="chapter-complete">
        <div class="trophy">🎓🌟</div>
        <h2>Journey Complete!</h2>
        <p style="color:#a099b0; margin-bottom:5px;">You've explored all of Jerusalem and learned <strong style="color:#a8e063;">${state.journal.length} Hebrew words & phrases!</strong></p>
        <p style="color:#a099b0; margin-bottom:5px;">Total XP: <strong style="color:#f0c27f;">${state.xp}</strong></p>
        <p style="color:#a099b0; margin-bottom:24px;">Hearts remaining: <span style="color:#fc5c7d;">${'❤️'.repeat(state.hearts)}</span></p>
        <div class="words-learned">
          ${state.journal.map(w => `
            <div class="word-badge">
              <span class="wb-hebrew">${w.hebrew}</span>
              <span class="wb-english">${w.meaning}</span>
            </div>
          `).join('')}
        </div>
        <p style="color:#c9a0dc; font-size:1.2em; margin:20px 0; font-style:italic;">
          "לְהִתְרָאוֹת — See you on your next adventure!"
        </p>
        <button class="btn" onclick="restartGame()" style="margin-top:10px;">Play Again</button>
      </div>`;
    return;
  }

  // Playing a chapter
  if (state.screen === 'playing') {
    renderPlaying(app);
  }
}

function renderMap(app) {
  let locationsHTML = chapters.map((ch, i) => {
    const completed = state.chaptersCompleted.includes(i);
    const unlocked = i === 0 || state.chaptersCompleted.includes(i - 1);
    const current = unlocked && !completed;
    let statusIcon = completed ? '✅' : (unlocked ? '➡️' : '🔒');
    let classes = 'map-loc' + (completed ? ' completed' : '') + (!unlocked ? ' locked' : '');

    return `<div class="${classes}" onclick="${unlocked && !completed ? `selectChapter(${i})` : (completed ? `selectChapter(${i})` : '')}">
      <div class="loc-icon">${ch.icon}</div>
      <div class="loc-info">
        <h3>${ch.location}</h3>
        <p>${ch.description}</p>
      </div>
      <div class="loc-status">${statusIcon}</div>
    </div>`;
  }).join('');

  const allDone = chapters.every((_, i) => state.chaptersCompleted.includes(i));

  app.innerHTML = `
    <div class="map-screen">
      <div style="font-size:2em; margin-bottom:10px;">🗺️</div>
      <h2>Your Journey Through Jerusalem</h2>
      <p style="color:#a099b0; margin-bottom:24px;">XP: <strong style="color:#f0c27f;">${state.xp}</strong> | Hearts: <span style="color:#fc5c7d;">${'❤️'.repeat(state.hearts)}${'🖤'.repeat(state.maxHearts - state.hearts)}</span> | Words: <strong style="color:#a8e063;">${state.journal.length}</strong></p>
      <div class="map-locations">${locationsHTML}</div>
      ${allDone ? `<button class="btn btn-gold" style="margin-top:30px;" onclick="showVictory()">Complete Your Journey ⭐</button>` : ''}
    </div>`;
}

function renderChapterComplete(app) {
  const ch = chapters[state.chapter];
  const wordsThisChapter = state.journal.filter(w => w.chapter === ch.id);

  app.innerHTML = `
    <div class="chapter-complete">
      <div class="trophy">🏆</div>
      <h2>${ch.title} Complete!</h2>
      <p class="stats">+${wordsThisChapter.length * 10} XP earned</p>
      <p style="color:#a099b0; margin-bottom:8px;">Words & phrases learned:</p>
      <div class="words-learned">
        ${wordsThisChapter.map(w => `
          <div class="word-badge">
            <span class="wb-hebrew">${w.hebrew}</span>
            <span class="wb-english">${w.meaning}</span>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-gold" onclick="returnToMap()" style="margin-top:10px;">Return to Map 🗺️</button>
    </div>`;
}

function renderPlaying(app) {
  const ch = chapters[state.chapter];
  const step = ch.steps[state.step];
  const progress = ((state.step + 1) / ch.steps.length) * 100;

  let contentHTML = '';

  if (step.type === 'story') {
    contentHTML = `
      <div class="story-box">
        <span class="scene-icon">${step.icon || '📜'}</span>
        ${step.text}
      </div>
      <div class="continue-area">
        <button class="btn" onclick="nextStep()">Continue →</button>
      </div>`;
  } else if (step.type === 'challenge') {
    const optionsHTML = step.options.map((opt, i) => {
      let cls = 'option-btn';
      if (state.challengeAnswered) {
        if (opt.correct) cls += ' correct';
        else if (state.chosenOption === i && !opt.correct) cls += ' wrong';
      }
      return `<button class="${cls}" onclick="answerChallenge(${i})" ${state.challengeAnswered ? 'disabled' : ''}>
        ${opt.text}
      </button>`;
    }).join('');

    let feedbackHTML = '';
    if (state.challengeAnswered) {
      const wasCorrect = step.options[state.chosenOption].correct;
      feedbackHTML = `
        <div class="feedback-msg ${wasCorrect ? 'correct' : 'wrong'}">
          ${wasCorrect ? '✨ ' + step.correctMsg : '💡 ' + step.wrongMsg}
        </div>
        <div class="continue-area">
          <button class="btn ${wasCorrect ? 'btn-green' : ''}" onclick="nextStep()">Continue →</button>
        </div>`;
    }

    contentHTML = `
      <div class="challenge-box">
        <h3>⚔️ Challenge</h3>
        <div class="question">
          ${step.question}
          ${step.questionHebrew ? `<div class="hebrew-big">${step.questionHebrew}</div>` : ''}
        </div>
        <div class="options">${optionsHTML}</div>
        ${feedbackHTML}
      </div>`;
  }

  app.innerHTML = `
    <div class="game-container">
      <div class="top-bar">
        <span class="chapter">${ch.icon} ${ch.location}</span>
        <span class="xp">⭐ ${state.xp} XP</span>
        <span class="hearts">${'❤️'.repeat(state.hearts)}${'🖤'.repeat(state.maxHearts - state.hearts)}</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" style="width: ${progress}%"></div>
      </div>
      ${contentHTML}
    </div>`;
}

// ─── Game Logic ───
function startGame() {
  state.screen = 'map';
  render();
}

function selectChapter(index) {
  state.chapter = index;
  state.step = 0;
  state.screen = 'playing';
  state.challengeAnswered = false;
  render();
}

function nextStep() {
  const ch = chapters[state.chapter];

  // Add word to journal if step teaches something
  const currentStep = ch.steps[state.step];
  if (currentStep.teaches) {
    const already = state.journal.find(w => w.hebrew === currentStep.teaches.hebrew);
    if (!already) {
      state.journal.push({ ...currentStep.teaches, chapter: ch.id });
      updateJournal();
    }
  }

  state.step++;
  state.challengeAnswered = false;

  if (state.step >= ch.steps.length) {
    // Chapter complete
    if (!state.chaptersCompleted.includes(state.chapter)) {
      state.chaptersCompleted.push(state.chapter);
    }
    state.screen = 'chapter-complete';
  }

  render();
}

function answerChallenge(optionIndex) {
  if (state.challengeAnswered) return;

  const ch = chapters[state.chapter];
  const step = ch.steps[state.step];
  const correct = step.options[optionIndex].correct;

  state.challengeAnswered = true;
  state.chosenOption = optionIndex;

  if (correct) {
    state.xp += 10;
  } else {
    state.hearts--;
    if (state.hearts <= 0) {
      state.screen = 'game-over';
    }
  }

  render();
}

function returnToMap() {
  state.screen = 'map';
  render();
}

function showVictory() {
  state.screen = 'victory';
  render();
}

function restartGame() {
  state.screen = 'title';
  state.chapter = 0;
  state.step = 0;
  state.xp = 0;
  state.hearts = 3;
  state.journal = [];
  state.chaptersCompleted = [];
  state.challengeAnswered = false;
  render();
}

// ─── Journal ───
function toggleJournal() {
  document.getElementById('journal-panel').classList.toggle('open');
}

function updateJournal() {
  const el = document.getElementById('journal-entries');
  if (state.journal.length === 0) {
    el.innerHTML = '<p class="journal-empty">Words you learn will appear here...</p>';
    return;
  }
  el.innerHTML = state.journal.map(w => `
    <div class="journal-entry">
      <div class="j-hebrew">${w.hebrew}</div>
      <div class="j-phonetic">${w.phonetic}</div>
      <div class="j-meaning">${w.meaning}</div>
    </div>
  `).join('');
}

// ─── Init ───
updateJournal();
render();
</script>
