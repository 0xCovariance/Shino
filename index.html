<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .stats {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      color: white;
      font-size: 1.3rem;
    }

    .stats span {
      background: rgba(255,255,255,0.2);
      padding: 8px 20px;
      border-radius: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 500px;
      width: 100%;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg);
    }

    .card.matched .card-front,
    .card.matched .card-back {
      animation: celebrate 0.5s ease;
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .card-front {
      background: linear-gradient(145deg, #ff9a56, #ff6b6b);
      color: white;
      font-size: 2.5rem;
    }

    .card-front::after {
      content: '?';
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    .card-back {
      background: white;
      transform: rotateY(180deg);
    }

    .card.matched .card-back {
      background: linear-gradient(145deg, #56ab2f, #a8e063);
    }

    @keyframes celebrate {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.1); }
    }

    .win-message {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .win-message.show {
      display: flex;
    }

    .win-box {
      background: white;
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      animation: popIn 0.5s ease;
    }

    .win-box h2 {
      font-size: 2.5rem;
      color: #764ba2;
      margin-bottom: 10px;
    }

    .win-box p {
      font-size: 1.3rem;
      color: #555;
      margin-bottom: 20px;
    }

    .win-box button, .restart-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .win-box button:hover, .restart-btn:hover {
      transform: scale(1.05);
    }

    .restart-btn {
      margin-bottom: 20px;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Memory Match</h1>

  <div class="stats">
    <span>Moves: <strong id="moves">0</strong></span>
    <span>Matches: <strong id="matches">0</strong> / <strong id="total-pairs">0</strong></span>
  </div>

  <button class="restart-btn" onclick="startGame()">New Game</button>

  <div class="board" id="board"></div>

  <div class="win-message" id="win-message">
    <div class="win-box">
      <h2>You Win!</h2>
      <p>You matched all pairs in <strong id="final-moves">0</strong> moves!</p>
      <button onclick="startGame()">Play Again</button>
    </div>
  </div>

  <script>
    const EMOJIS = [
      '🐶', '🐱', '🐸', '🦊', '🐻', '🐼', '🐨', '🦁',
      '🐯', '🐮', '🐷', '🐵', '🦄', '🐙', '🦋', '🐢'
    ];

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matchCount = 0;
    let totalPairs = 0;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame() {
      // Pick 8 random emojis, duplicate them for pairs
      const picked = shuffle(EMOJIS).slice(0, 8);
      const cards = shuffle([...picked, ...picked]);
      totalPairs = picked.length;

      // Reset state
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      moves = 0;
      matchCount = 0;

      document.getElementById('moves').textContent = '0';
      document.getElementById('matches').textContent = '0';
      document.getElementById('total-pairs').textContent = totalPairs;
      document.getElementById('win-message').classList.remove('show');

      // Build board
      const board = document.getElementById('board');
      board.innerHTML = '';

      cards.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.innerHTML = `
          <div class="card-front"></div>
          <div class="card-back">${emoji}</div>
        `;
        card.addEventListener('click', () => flipCard(card));
        board.appendChild(card);
      });
    }

    function flipCard(card) {
      if (lockBoard) return;
      if (card === firstCard) return;
      if (card.classList.contains('matched')) return;

      card.classList.add('flipped');

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      lockBoard = true;
      moves++;
      document.getElementById('moves').textContent = moves;

      if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
        // Match found!
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        matchCount++;
        document.getElementById('matches').textContent = matchCount;

        resetTurn();

        if (matchCount === totalPairs) {
          setTimeout(() => {
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('win-message').classList.add('show');
          }, 600);
        }
      } else {
        // No match — flip back
        setTimeout(() => {
          firstCard.classList.remove('flipped');
          secondCard.classList.remove('flipped');
          resetTurn();
        }, 800);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    // Start the game on load
    startGame();
  </script>

</body>
</html>
